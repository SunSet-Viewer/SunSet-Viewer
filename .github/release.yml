changelog:
  exclude:
    labels:
      - skip changelog
  categories:
    - title: Features
      labels:
        - feature
    - title: Fixes
      labels:
        - fix
    - title: Performance
      labels:
        - performance
    - title: Maintenance and documentation
      labels:
        - maintenance
        - docs
    - title: Other changes
      labels:
        - "*"
