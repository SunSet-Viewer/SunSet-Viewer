name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a version tag on main
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          ci_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --commit "$GITHUB_SHA" --json status,conclusion --limit 1)"
          ci_status="$(jq -r '.[0].status // empty' <<< "$ci_run")"
          ci_conclusion="$(jq -r '.[0].conclusion // empty' <<< "$ci_run")"
          if [[ "$ci_status" == "completed" && "$ci_conclusion" == "failure" ]]; then
            echo "The tagged commit had a failing CI run." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or reuse a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AURORA_VERSION_TAG: ${{ steps.tag.outputs.tag }}
          IS_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if release="$(gh release view "$AURORA_VERSION_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release")" != true ]]; then
              echo "A published release already exists for $AURORA_VERSION_TAG." >&2
              exit 1
            fi
            echo "Reusing the existing draft release for $AURORA_VERSION_TAG."
          else
            args=(--repo "$GITHUB_REPOSITORY" --title "SunSet Viewer $AURORA_VERSION_TAG" --generate-notes --verify-tag --draft)
            if [[ "$IS_PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$AURORA_VERSION_TAG" "${args[@]}"
          fi

  windows:
    name: Windows ZIP, MSI and symbols
    needs: prepare
    permissions:
      actions: read
      contents: write
    runs-on: windows-latest
    env:
      AURORA_VERSION_TAG: ${{ needs.prepare.outputs.tag }}
      CARGO_PROFILE_RELEASE_DEBUG: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build release viewer
        run: cargo build --release --locked -p aurora-viewer --features xr-static-loader
      - name: Verify release version
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/SunSet-Viewer.exe -Tag $env:AURORA_VERSION_TAG
      - name: Build crash symbols
        shell: pwsh
        run: |
          cargo install dump_syms --version 2.3.9 --locked
          if ($LASTEXITCODE -ne 0) { throw "Installing dump_syms failed ($LASTEXITCODE)." }
          $pdb = Join-Path $env:GITHUB_WORKSPACE 'target/release/SunSet-Viewer.pdb'
          if (-not (Test-Path -LiteralPath $pdb)) {
            $pdb = Join-Path $env:GITHUB_WORKSPACE 'target/release/SunSet_Viewer.pdb'
          }
          if (-not (Test-Path -LiteralPath $pdb)) {
            # Search the release tree in case Cargo places the linked PDB in deps/ or with underscores.
            $pdb = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target/release') -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'SunSet*Viewer*.pdb' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $pdb -or -not (Test-Path -LiteralPath $pdb)) {
            $found = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'target/release') -Filter '*.pdb' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "Missing release symbols for SunSet-Viewer.exe. Cargo profile debug is '$env:CARGO_PROFILE_RELEASE_DEBUG'. PDB files found: $($found -join ', ')"
          }
          $lines = & dump_syms $pdb
          if ($LASTEXITCODE -ne 0 -or -not $lines) { throw 'dump_syms could not read the release PDB.' }
          $header = $lines[0] -split '\s+'
          if ($header.Count -lt 5 -or $header[0] -ne 'MODULE') { throw "Invalid symbol header: $($lines[0])" }
          $module = $header[4]
          $debugId = $header[3]
          $symbolName = [IO.Path]::GetFileNameWithoutExtension($module) + '.sym'
          $symbolDir = Join-Path (Join-Path (Join-Path $env:RUNNER_TEMP 'symbols') $module) $debugId
          New-Item -ItemType Directory -Force -Path $symbolDir | Out-Null
          $symbolPath = Join-Path $symbolDir $symbolName
          $lines | Out-File -LiteralPath $symbolPath -Encoding ascii
          $output = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $symbolsZip = Join-Path $output "SunSet-Viewer-${env:AURORA_VERSION_TAG}-windows-x64-symbols.zip"
          $moduleDir = Join-Path (Join-Path $env:RUNNER_TEMP 'symbols') $module
          Compress-Archive -Path $moduleDir -DestinationPath $symbolsZip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $symbolsZip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("${symbolsZip}.sha256", "$hash  $(Split-Path -Leaf $symbolsZip)`n", [Text.UTF8Encoding]::new($false))
      - name: Sign the Windows executable when a certificate is configured
        if: needs.prepare.outputs.prerelease == 'false'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Warning 'Windows signing secrets are not configured; this release will be unsigned.'
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE_PFX -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Set both WINDOWS_CERTIFICATE_PFX and WINDOWS_CERTIFICATE_PASSWORD.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sunset-code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certs = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $cert = $certs | Where-Object { $_.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3' } | Select-Object -First 1
          if (-not $cert) { throw 'The configured PFX has no Code Signing certificate.' }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'Could not locate signtool.exe.' }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $cert.Thumbprint target/release/SunSet-Viewer.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing the viewer failed ($LASTEXITCODE)." }
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $name = "SunSet-Viewer-${env:AURORA_VERSION_TAG}-windows-x64"
          $package = Join-Path $env:RUNNER_TEMP $name
          & ./scripts/package.ps1 -Exe target/release/SunSet-Viewer.exe -Out $package -Source $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Packaging the Windows folder failed ($LASTEXITCODE)." }
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          $zip = Join-Path release-output "$name.zip"
          Compress-Archive -Path $package -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("${zip}.sha256", "$hash  $(Split-Path -Leaf $zip)`n", [Text.UTF8Encoding]::new($false))
          "PACKAGE_ROOT=$package" >> $env:GITHUB_ENV
      - name: Install the pinned WiX toolset
        if: needs.prepare.outputs.prerelease == 'false'
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Installing WiX failed ($LASTEXITCODE)." }
          "$env:RUNNER_TEMP\wix" >> $env:GITHUB_PATH
      - name: Build MSI installer
        if: needs.prepare.outputs.prerelease == 'false'
        shell: pwsh
        run: ./scripts/package-msi.ps1 -Package $env:PACKAGE_ROOT -Out "release-output/SunSet-Viewer-${env:AURORA_VERSION_TAG}-windows-x64.msi"
      - name: Sign MSI when a certificate is configured
        if: needs.prepare.outputs.prerelease == 'false'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sunset-code-signing.pfx'
          if (-not (Test-Path -LiteralPath $pfx)) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          }
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certs = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $cert = $certs | Where-Object { $_.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3' } | Select-Object -First 1
          if (-not $cert) { throw 'The configured PFX has no Code Signing certificate.' }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'Could not locate signtool.exe.' }
          $msi = "release-output/SunSet-Viewer-${env:AURORA_VERSION_TAG}-windows-x64.msi"
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $cert.Thumbprint $msi
          if ($LASTEXITCODE -ne 0) { throw "Signing the MSI failed ($LASTEXITCODE)." }
      - name: Create missing checksums
        shell: pwsh
        run: |
          Get-ChildItem release-output -File | Where-Object { $_.Extension -ne '.sha256' } | ForEach-Object {
            if (-not (Test-Path -LiteralPath "$($_.FullName).sha256")) {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n", [Text.UTF8Encoding]::new($false))
            }
          }
      - name: Upload Windows packages to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -LiteralPath release-output -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No Windows release files were produced.' }
          & gh release upload $env:AURORA_VERSION_TAG @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading Windows release files failed ($LASTEXITCODE)." }

  macos:
    name: macOS ARM64 DMG
    needs: prepare
    permissions:
      actions: read
      contents: write
    runs-on: macos-15
    env:
      AURORA_VERSION_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build release viewer
        run: cargo build --release --locked -p aurora-viewer
      - name: Verify release version
        run: pwsh ./scripts/verify-version.ps1 -Exe target/release/SunSet-Viewer -Tag "$AURORA_VERSION_TAG"
      - name: Package the macOS application
        run: pwsh ./scripts/package-macos.ps1 -Exe target/release/SunSet-Viewer -Out "$RUNNER_TEMP/SunSet Viewer.app"
      - name: Sign the application
        id: sign
        shell: bash
        env:
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SunSet Viewer.app"
          values=("${MACOS_CERTIFICATE_P12:-}" "${MACOS_CERTIFICATE_PASSWORD:-}" "${APPLE_TEAM_ID:-}" "${APPLE_API_KEY_ID:-}" "${APPLE_API_ISSUER_ID:-}" "${APPLE_API_KEY_P8:-}")
          present=0
          for value in "${values[@]}"; do [[ -n "$value" ]] && present=$((present + 1)); done
          if [[ "$present" -ne 0 && "$present" -ne 6 ]]; then
            echo 'Configure all six Apple signing and notarization secrets, or none of them.' >&2
            exit 1
          fi
          if [[ "$IS_PRERELEASE" == true ]]; then
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            echo 'mode=adhoc' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$present" -eq 0 ]]; then
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            echo 'mode=adhoc' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/sunset-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then echo 'No Developer ID Application identity was imported.' >&2; exit 1; fi
          codesign --force --deep --options runtime --timestamp --entitlements packaging/macos/aurora-viewer.entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "mode=developer" >> "$GITHUB_OUTPUT"
          security delete-keychain "$keychain"
      - name: Create macOS disk image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          dmg="release-output/SunSet-Viewer-${AURORA_VERSION_TAG}-macos-arm64.dmg"
          staging="$RUNNER_TEMP/dmg-root"
          mkdir -p "$staging"
          ditto "$RUNNER_TEMP/SunSet Viewer.app" "$staging/SunSet Viewer.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname 'SunSet Viewer' -srcfolder "$staging" -ov -format UDZO "$dmg"
          shasum -a 256 "$dmg" | awk '{print $1 "  " $2}' > "$dmg.sha256"
      - name: Notarize and staple the disk image
        if: steps.sign.outputs.mode == 'developer' && needs.prepare.outputs.prerelease == 'false'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          dmg="release-output/SunSet-Viewer-${AURORA_VERSION_TAG}-macos-arm64.dmg"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          shasum -a 256 "$dmg" | awk '{print $1 "  " $2}' > "$dmg.sha256"
      - name: Upload macOS packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$AURORA_VERSION_TAG" release-output/* --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    name: Linux x64 archive
    needs: prepare
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    env:
      AURORA_VERSION_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libasound2-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
      - name: Build release viewer
        run: cargo build --release --locked -p aurora-viewer
      - name: Verify release version
        run: pwsh ./scripts/verify-version.ps1 -Exe target/release/SunSet-Viewer -Tag "$AURORA_VERSION_TAG"
      - name: Create portable archive
        shell: bash
        run: |
          set -euo pipefail
          package="SunSet-Viewer-${AURORA_VERSION_TAG}-linux-x64"
          pwsh ./scripts/package.ps1 -Exe target/release/SunSet-Viewer -Out "$RUNNER_TEMP/$package" -Source "$GITHUB_WORKSPACE"
          mkdir -p release-output
          archive="release-output/${package}.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$package"
          sha256sum "$archive" | awk '{print $1 "  " $2}' > "$archive.sha256"
      - name: Upload Linux packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$AURORA_VERSION_TAG" release-output/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish GitHub release
    needs: [prepare, windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AURORA_VERSION_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Add update policy and verify release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          ./scripts/write-update-policy.ps1 -Tag $env:AURORA_VERSION_TAG -Out release-output/aurora-update-policy.json
          if (-not (Test-Path -LiteralPath 'release-output/aurora-update-policy.json')) { throw 'Missing update policy.' }
          $required = @(
            "SunSet-Viewer-$env:AURORA_VERSION_TAG-windows-x64.zip",
            "SunSet-Viewer-$env:AURORA_VERSION_TAG-windows-x64-symbols.zip",
            "SunSet-Viewer-$env:AURORA_VERSION_TAG-macos-arm64.dmg",
            "SunSet-Viewer-$env:AURORA_VERSION_TAG-linux-x64.tar.gz"
          )
          if (-not $env:AURORA_VERSION_TAG.Contains('-')) {
            $msi = "SunSet-Viewer-$env:AURORA_VERSION_TAG-windows-x64.msi"
            $required += $msi
          }
          & gh release upload $env:AURORA_VERSION_TAG 'release-output/aurora-update-policy.json' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading the update policy failed ($LASTEXITCODE)." }
          $release = & gh release view $env:AURORA_VERSION_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded release assets.' }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($file in $required) {
            foreach ($name in @($file, "$file.sha256")) {
              if ($assetNames -notcontains $name) { throw "Missing uploaded release asset: $name" }
            }
          }
          if ($assetNames -notcontains 'aurora-update-policy.json') { throw 'Missing uploaded release asset: aurora-update-policy.json' }
      - name: Publish verified draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$AURORA_VERSION_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
